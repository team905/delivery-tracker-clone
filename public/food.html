<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#e23744" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Food delivery · Zomato</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="app-shell app-home">
    <div class="z-surface">
      <header class="z-header" role="banner">
        <div class="z-header__row z-header__row--top">
          <a class="z-logo z-logo--back" href="/" aria-label="Back to services">
            <span class="z-logo__back" aria-hidden="true">‹</span>
            <span>zomato</span>
          </a>
          <button type="button" class="z-icon-btn" aria-label="Account">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <button type="button" class="z-loc-pill" id="locPill" aria-label="Delivery location">
          <span class="z-loc-pill__icon" aria-hidden="true">⌖</span>
          <span class="z-loc-pill__text">
            <span class="z-loc-pill__label">Your location</span>
            <span class="z-loc-pill__val">Mumbai, Powai — Hiranandani</span>
          </span>
          <span class="z-loc-pill__chev" aria-hidden="true">▾</span>
        </button>
        <label class="z-search" aria-label="Search restaurants">
          <span class="z-search__ic" aria-hidden="true"
            ><svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" />
              <path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </span>
          <input
            id="searchInput"
            class="z-search__input"
            type="search"
            enterkeyhint="search"
            placeholder="Search for restaurant, item or dish"
            autocomplete="off"
          />
        </label>
      </header>

      <div class="z-cat-scroll" role="tablist" aria-label="Quick filters">
        <button type="button" class="z-cat z-cat--on" data-filter="all">All</button>
        <button type="button" class="z-cat" data-filter="veg">Pure veg</button>
        <button type="button" class="z-cat" data-filter="fast">Fast delivery</button>
        <button type="button" class="z-cat" data-filter="rating">Top rated</button>
        <button type="button" class="z-cat" data-filter="under">₹200 for two</button>
      </div>

      <main class="z-main" id="main">
        <section class="z-hero-offer" aria-label="Promo">
          <div class="z-hero-offer__inner">
            <p class="z-hero-offer__eyebrow">Up to 60% off</p>
            <h2 class="z-hero-offer__title">On your first 3 food orders</h2>
            <p class="z-hero-offer__sub">Use code <strong>ZOMATONEW</strong> at checkout</p>
          </div>
        </section>

        <div class="z-section-head">
          <h1 class="z-h1">Delivery restaurants in your area</h1>
          <p class="z-shimmer">125+ options · sorted by distance &amp; rating</p>
        </div>

        <div id="restaurantsGrid" class="z-list"></div>
      </main>
    </div>

    <nav class="z-tabbar safe-bottom" role="navigation" aria-label="Main">
      <a href="/food.html" class="z-tab z-tab--active" aria-current="page">
        <span class="z-tab__ic" aria-hidden="true"
          ><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
            ><path
              d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9.5z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round" /></svg
        ></span>
        <span>Order</span>
      </a>
      <a href="javascript:void(0)" class="z-tab" tabindex="0" aria-label="Dining, coming soon"
        ><span class="z-tab__ic" aria-hidden="true"
          ><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
            ><path
              d="M3 3h18M6 3v6a6 6 0 0012 0V3M9 21V12h6v9"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round" /></svg
        ></span>
        <span>Dining</span>
      </a>
      <a href="/login.html" class="z-tab" id="foodAccountTab"
        ><span class="z-tab__ic" aria-hidden="true"
          ><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
            ><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7" />
            <path d="M4 21a8 8 0 0116 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg
        ></span>
        <span id="foodAccountLabel">Sign in</span>
      </a>
    </nav>

    <script src="/auth-client.js"></script>
    <script src="/home.js"></script>
    <script>
      Auth.me().then((u) => {
        if (!u) return;
        const a = document.getElementById("foodAccountTab");
        const l = document.getElementById("foodAccountLabel");
        a.href = Auth.homeFor(u.role);
        l.textContent = u.role === "customer" ? "Account" : "Dashboard";
      });
    </script>
  </body>
</html>
