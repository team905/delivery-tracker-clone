<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>My account · Delivery Super-app</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/native.css" />
    <link rel="stylesheet" href="/role-panels.css" />
  </head>
  <body class="rp-body">
    <div class="rp-shell">
      <aside class="rp-side">
        <div class="rp-side-brand">
          <div class="rp-side-brand-logo">U</div>
          <div>
            <div class="rp-side-brand-text">My Account</div>
            <div class="rp-side-brand-sub">Profile, orders, wallet</div>
          </div>
        </div>
        <nav class="rp-side-nav" id="navTabs">
          <a href="#profile" class="is-active">👤 Profile</a>
          <a href="#orders">📦 My orders</a>
          <a href="#addresses">📍 Saved addresses</a>
          <a href="#wallet">💳 Wallet</a>
          <a href="#notifications">🔔 Notifications</a>
          <a href="#support">🆘 Support</a>
          <a href="/" class="rp-back">← Back to home</a>
        </nav>
        <div class="rp-side-foot">
          <div class="rp-side-user">
            <img id="userAvatar" alt="" />
            <div>
              <div class="rp-side-user-name" id="userName">—</div>
              <div class="rp-side-user-role">Customer</div>
            </div>
          </div>
          <button class="rp-side-logout" id="logoutBtn">Sign out</button>
        </div>
      </aside>
      <main class="rp-main"><div id="page"></div></main>
    </div>
    <div class="rp-toast" id="toast"></div>
    <script src="/native.js"></script>
    <script src="/auth-client.js"></script>
    <script src="/account-app.js"></script>
  </body>
</html>
