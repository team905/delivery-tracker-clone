name: Render Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          echo "Triggering Render deploy hook..."
          HTTP_CODE=$(curl -s -o /tmp/render_hook_response.txt -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Render deploy hook failed with HTTP $HTTP_CODE"
            cat /tmp/render_hook_response.txt
            exit 1
          fi

          echo "Render deploy triggered successfully (HTTP $HTTP_CODE)."
